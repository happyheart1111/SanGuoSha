<script>
// ==================== AI 决策模块 ====================
// 所有 AI 玩家的行为逻辑，通过 Game.prototype 扩展实现。
// 包含出牌策略（优先级排序）、技能使用判断、目标选择、防御响应（闪/无懈/桃）、
// 濒死自救等完整自动化决策流程。通过 AI_SPEED 变量控制执行速度。

// AI 速度倍率：0~1，越小越快。1=原速，0.45=默认提速（适合网页版）
let AI_SPEED = 0.45;
// 最小延迟，AI出牌停顿0.3秒
const AI_MIN_DELAY = 300;

// 获取实际延迟
function _aid(ms) { return Math.max(AI_MIN_DELAY, Math.round(ms * AI_SPEED)); }

// 公开 API：设置 AI 速度
function setAISpeed(speed) { AI_SPEED = Math.max(0.05, Math.min(1, speed)); }
function getAISpeed() { return AI_SPEED; }

// AI 摸牌阶段
Game.prototype.aiDrawPhase = function(player, skipPlay) {
  const goToNext = () => {
    this.phase = 'play';
    this.render();
    if (!skipPlay) {
      setTimeout(() => this.aiPlayPhase(player), _aid(800));
    } else {
      setTimeout(() => this.goToDiscardPhase(player), _aid(600));
    }
  };

  const drawSeq = (count, onDone) => {
    const drawNext = (i) => {
      if (i >= count) { onDone(); return; }
      this.drawCard(player, 1);
      this.render();
      setTimeout(() => drawNext(i + 1), 250);
    };
    drawNext(0);
  };

  // 神·鲁肃缔盟
  if (player.hero.id === 'shen-lusu') {
    this.addLog(`${player.hero.name}发动【缔盟】，摸了4张牌`, 'skill');
    drawSeq(4, goToNext);
    return;
  }
  // 张辽突袭 AI
  if (player.hero.id === 'zhangliao' && !this.tuxiUsedThisTurn) {
    this.tuxiUsedThisTurn = true;
    const others = this.players.filter(p => p.alive && p.id !== player.id && p.hand.length > 0);
    const targets = others.sort(() => Math.random() - 0.5).slice(0, 2);
    if (targets.length > 0) {
      for (const t of targets) {
        const card = t.hand[Math.floor(Math.random() * t.hand.length)];
        this.transferCard(t, player, card);
        this.addLog(`${player.hero.name}发动【突袭】，获得了${t.hero.name}的一张【${card.name}】`, 'skill');
      }
      goToNext();
    } else {
      this.addLog(`${player.hero.name} 无目标可突袭，摸了2张牌`);
      drawSeq(2, goToNext);
    }
    return;
  }
  // 神吕蒙涉猎
  if (player.hero.id === 'shen-lvmeng') {
    this.resolveShelie(player);
    goToNext();
    return;
  }
  // 默认摸2张
  this.addLog(`${player.hero.name} 摸了2张牌`);
  drawSeq(2, goToNext);
};

// AI 出牌阶段入口
Game.prototype.aiPlayPhase = function(player) {
  if (this.phase !== 'play' || this.gameOver) return;
  if (this.waitingForTarget) return;
  if (!player.alive) { this.nextPlayer(); return; }

  // AI技能
  this.aiUseSkills(player);

  // 如果技能触发了效果需要等待，延迟出牌
  setTimeout(() => this.aiPlayCards(player), _aid(300));
};

// AI 使用武将技能
Game.prototype.aiUseSkills = function(player) {
  // 孙权制衡
  if (player.hero.id === 'sunquan' && !this.zhihengUsedThisTurn && player.hand.length >= 3) {
    const count = player.hand.length;
    const cards = [...player.hand];
    for (const c of cards) this.discardCard(player, c);
    this.drawCard(player, count);
    this.zhihengUsedThisTurn = true;
    this.addLog(`${player.hero.name}发动【制衡】，弃置${count}张牌并摸了${count}张牌`, 'skill');
  }

  // 刘备仁德
  if (player.hero.id === 'liubei' && player.hand.length >= 3 && player.hp < player.hero.maxHp) {
    const allies = this.players.filter(p => p.alive && p.id !== player.id && (!this.isDouDizhu || this.getAllies(player).some(a => a.id === p.id)));
    if (allies.length > 0) {
      const ally = allies.reduce((a, b) => a.hp <= b.hp ? a : b);
      const count = player.hand.length;
      const cards = [...player.hand];
      for (const c of cards) {
        const idx = player.hand.indexOf(c);
        if (idx >= 0) player.hand.splice(idx, 1);
        c.ownerId = ally.id;
        ally.hand.push(c);
      }
      this.addLog(`${player.hero.name}发动【仁德】，将${count}张手牌交给${ally.hero.name}`, 'skill');
      if (count >= 2) { player.hp++; this.addLog(`${player.hero.name}回复1点体力`, 'heal'); }
    }
  }

  // 黄盖苦肉
  if (player.hero.id === 'huanggai' && player.hp > 2 && player.hand.length <= 3) {
    const times = Math.min(2, player.hp - 1);
    for (let i = 0; i < times; i++) {
      if (player.hp <= 1) break;
      player.hp--;
      this.drawCard(player, 2);
      this.addLog(`${player.hero.name}发动【苦肉】，失去1点体力并摸2张牌`, 'skill');
    }
  }

  // 孙尚香结姻
  if (player.hero.id === 'sunshangxiang' && !this.jieyinUsedThisTurn && player.hand.length >= 2
      && (player.hp < player.hero.maxHp)) {
    const ally = this.players.find(p => p.alive && p.id !== player.id && p.hp < p.hero.maxHp && (!this.isDouDizhu || this.getAllies(player).some(a => a.id === p.id)));
    if (ally) {
      const cards = player.hand.slice(0, 2);
      for (const c of cards) this.discardCard(player, c);
      if (player.hp < player.hero.maxHp) player.hp++;
      if (ally.hp < ally.hero.maxHp) ally.hp++;
      this.jieyinUsedThisTurn = true;
      this.addLog(`${player.hero.name}发动【结姻】，与${ally.hero.name}各回复体力`, 'skill');
    }
  }
  // 华佗青囊
  if (player.hero.id === 'huatuo' && !this.qingnangUsedThisTurn && player.hand.length >= 1) {
    const injured = this.players.find(p => p.alive && p.hp < p.hero.maxHp && (!this.isDouDizhu || p.id === player.id || this.getAllies(player).some(a => a.id === p.id)));
    if (injured) {
      const card = player.hand[0];
      this.discardCard(player, card);
      injured.hp++;
      this.qingnangUsedThisTurn = true;
      this.addLog(`${player.hero.name}发动【青囊】，弃【${card.name}】令${injured.hero.name}回复1点体力`, 'skill');
    }
  }
  // 神·鲁肃好施
  if (player.hero.id === 'shen-lusu' && !this.haoshiUsedThisTurn && player.hand.length >= 1) {
    const injured = this.players.find(p => p.alive && p.hp < p.hero.maxHp && (!this.isDouDizhu || p.id === player.id || this.getAllies(player).some(a => a.id === p.id)));
    if (injured) {
      const card = player.hand[0];
      this.discardCard(player, card);
      injured.hp++;
      this.haoshiUsedThisTurn = true;
      this.addLog(`${player.hero.name}发动【好施】，弃【${card.name}】令${injured.hero.name}回复1点体力`, 'skill');
    }
  }
  // 神周瑜业炎
  if (player.hero.id === 'shen-zhouyu' && !this.yeyanUsedThisTurn && player.hand.length >= 3) {
    const enemy = this.players.filter(p => p.alive && p.id !== player.id && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id))).sort((a, b) => a.hp - b.hp)[0];
    if (enemy) {
      const cards = player.hand.splice(0, 3);
      for (const c of cards) this.discardPile.push(c);
      this.yeyanUsedThisTurn = true;
      this.addLog(`${player.hero.name}发动【业炎】，对${enemy.hero.name}造成2点火焰伤害！`, 'skill');
      this.dealDamage(enemy, player, 2, { name: '业炎' });
    }
  }
  // 神吕蒙攻心
  if (player.hero.id === 'shen-lvmeng' && !this.gongxinUsedThisTurn) {
    const target = this.players.find(p => p.alive && p.id !== player.id && p.hand.some(c => c.suit === '♥'));
    if (target) {
      const heartCard = target.hand.find(c => c.suit === '♥');
      this.discardCard(target, heartCard);
      this.gongxinUsedThisTurn = true;
      this.addLog(`${player.hero.name}发动【攻心】，弃置${target.hero.name}的♥【${heartCard.name}】`, 'skill');
    }
  }
};

// AI 出牌
Game.prototype.aiPlayCards = function(player) {
  if (this.gameOver) return;
  if (this.waitingForTarget) return;
  this.render();

  // 装备武器/坐骑/防具
  const equipTypes = ['weapon', 'plusHorse', 'minusHorse', 'armor'];
  const equipIdx = player.hand.findIndex(c => equipTypes.includes(c.type));
  if (equipIdx >= 0) {
    const card = player.hand[equipIdx];
    const slotMap = { weapon: 'weapon', plusHorse: 'plusHorse', minusHorse: 'minusHorse', armor: 'armor' };
    const slot = slotMap[card.type];
    const shouldEquip = !player.equipment[slot] ||
      (card.type === 'weapon' && player.equipment.weapon && card.range > player.equipment.weapon.range);
    if (shouldEquip) {
      player.hand.splice(equipIdx, 1);
      this.equipCard(player, card);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(300));
      return;
    }
  }

  // 无中生有
  const wuzhongIdx = player.hand.findIndex(c => c.type === 'wuzhong');
  if (wuzhongIdx >= 0) {
    const card = player.hand[wuzhongIdx];
    this.discardCard(player, card);
    this.addLog(`${player.hero.name}使用了无中生有，摸2张牌`);
    this.drawCard(player, 1);
    this.render();
    setTimeout(() => {
      this.drawCard(player, 1);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(300));
    }, 250);
    return;
  }

  // AOE：地主可释放（压制双农民）；农民释放会误伤队友，斗地主中禁止
  const aoeIdx = player.hand.findIndex(c => c.type === 'nanman' || c.type === 'wanjian');
  if (aoeIdx >= 0 && !(this.isDouDizhu && player.role === 'nongmin')) {
    const card = player.hand[aoeIdx];
    this.discardCard(player, card);
    if (card.type === 'nanman') this.resolveNanman(player);
    else this.resolveWanjian(player);
    this.render();
    setTimeout(() => this.aiPlayCards(player), _aid(1000));
    return;
  }

  // 桃园结义：斗地主中团队治疗会惠及敌人，AI 不释放
  const taoyuanIdx = player.hand.findIndex(c => c.type === 'taoyuan');
  if (taoyuanIdx >= 0 && !this.isDouDizhu) {
    const card = player.hand[taoyuanIdx];
    this.discardCard(player, card);
    this.resolveTaoyuan(player);
    this.render();
    setTimeout(() => this.aiPlayCards(player), 500);
    return;
  }

  // 五谷丰登：同上，斗地主中 AI 不释放
  const wuguIdx = player.hand.findIndex(c => c.type === 'wugu');
  if (wuguIdx >= 0 && !this.isDouDizhu) {
    const card = player.hand[wuguIdx];
    this.discardCard(player, card);
    this.resolveWugu(player);
    this.render();
    setTimeout(() => this.aiPlayCards(player), 500);
    return;
  }

  // 桃主动使用
  if (player.hp < player.hero.maxHp) {
    const taoIdx = player.hand.findIndex(c => c.type === 'tao');
    if (taoIdx >= 0) {
      const card = player.hand[taoIdx];
      this.discardCard(player, card);
      this.resolveTao(player);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(300));
      return;
    }
    // 华佗急救：红色牌当桃
    if (player.hero.id === 'huatuo') {
      const redIdx = player.hand.findIndex(c => isRedSuit(c.suit));
      if (redIdx >= 0) {
        const card = player.hand[redIdx];
        this.discardCard(player, card);
        player.hp++;
        this.addLog(`${player.hero.name}发动【急救】将${card.suit}【${card.name}】当【桃】使用`, 'skill');
        this.render();
        setTimeout(() => this.aiPlayCards(player), _aid(300));
        return;
      }
    }
  }

  // 乐不思蜀 - 对任意敌人使用
  const lebuIdx = player.hand.findIndex(c => c.type === 'lebu');
  if (lebuIdx >= 0) {
    const card = player.hand[lebuIdx];
    const targets = this.players.filter(p => p.alive && p.id !== player.id && p.judgeArea.length < 3 && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id)));
    if (targets.length > 0) {
      const target = targets.reduce((a, b) => a.hp <= b.hp ? a : b);
      this.discardCard(player, card);
      this.resolveLebu(target);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(500));
      return;
    }
  }
  // 兵粮寸断 - 仅可对距离1内的敌人使用
  const bingliangIdx = player.hand.findIndex(c => c.type === 'bingliang');
  if (bingliangIdx >= 0) {
    const card = player.hand[bingliangIdx];
    const targets = this.players.filter(p => p.alive && p.id !== player.id && p.judgeArea.length < 3 && this.calcDistance(player, p) <= 1 && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id)));
    if (targets.length > 0) {
      const target = targets.reduce((a, b) => a.hp <= b.hp ? a : b);
      this.discardCard(player, card);
      this.resolveBingliang(target);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(500));
      return;
    }
  }
  // 闪电
  const shandianIdx = player.hand.findIndex(c => c.type === 'shandian');
  if (shandianIdx >= 0 && player.judgeArea.length < 3) {
    const card = player.hand[shandianIdx];
    this.discardCard(player, card);
    this.resolveShandian(player);
    this.render();
    setTimeout(() => this.aiPlayCards(player), 500);
    return;
  }

  // 过河拆桥/顺手牵羊
  const toolIdx = player.hand.findIndex(c => c.type === 'guohe' || c.type === 'shunshou');
  if (toolIdx >= 0) {
    const card = player.hand[toolIdx];
    const hasEquip = (p) => p.equipment.weapon || p.equipment.armor || p.equipment.plusHorse || p.equipment.minusHorse;
    const targets = this.players.filter(p => p.alive && p.id !== player.id && p.hero.id !== 'jiaxu' && (p.hand.length > 0 || (card.type === 'guohe' && (hasEquip(p) || p.judgeArea.length > 0))) && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id)));
    if (targets.length > 0) {
      const target = targets.reduce((a, b) => a.hp >= b.hp ? a : b);
      this.discardCard(player, card);
      if (card.type === 'guohe') this.resolveGuohe(target);
      else this.resolveShunshou(player, target);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(500));
      return;
    }
  }

  // 决斗
  const juedouIdx = player.hand.findIndex(c => c.type === 'juedou');
  if (juedouIdx >= 0) {
    const card = player.hand[juedouIdx];
    const targets = this.players.filter(p => p.alive && p.id !== player.id && p.hero.id !== 'jiaxu' && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id)));
    if (targets.length > 0) {
      const target = targets.reduce((a, b) => a.hand.length <= b.hand.length ? a : b);
      this.discardCard(player, card);
      this.resolveJuedou(player, target);
      this.render();
      setTimeout(() => this.aiPlayCards(player), _aid(500));
      return;
    }
  }

  // 酒：在准备出杀之前使用
  const jiuIdx = player.hand.findIndex(c => c.type === 'jiu' && !this.jiuDamageBoost);
  if (jiuIdx >= 0) {
    const shaIndex = player.hand.findIndex(c => c.type === 'sha');
    if (shaIndex >= 0) {
      const shaTarget = this.players.find(p => p.alive && p.id !== player.id && this.calcDistance(player, p, true) <= this.getShaRange(player));
      if (shaTarget && shaTarget.hp >= 2) {
        const card = player.hand[jiuIdx];
        this.discardCard(player, card);
        this.resolveJiu(player);
      }
    }
  }

  // 火攻：有同花色手牌时对敌人使用
  const huogongIdx = player.hand.findIndex(c => c.type === 'huogong');
  if (huogongIdx >= 0) {
    const card = player.hand[huogongIdx];
    const targets = this.players.filter(p => p.alive && p.id !== player.id && p.hand.length > 0 && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id)));
    if (targets.length > 0) {
      const target = targets.reduce((a, b) => a.hp <= b.hp ? a : b);
      // 检查是否有弃牌能力
      const hasSameSuit = player.hand.some(c => c.suit === (target.hand[0]?.suit || '♠'));
      if (hasSameSuit || player.hand.length > 2) {
        this.discardCard(player, card);
        this.resolveHuogong(player, target);
        this.render();
        setTimeout(() => this.aiPlayCards(player), _aid(800));
        return;
      }
    }
  }

  // 铁索连环：随机选择目标
  const tiesuoIdx = player.hand.findIndex(c => c.type === 'tiesuo');
  if (tiesuoIdx >= 0) {
    const card = player.hand[tiesuoIdx];
    this.discardCard(player, card);
    this.resolveTiesuo(player);
    this.render();
    setTimeout(() => this.aiPlayCards(player), 500);
    return;
  }

  // 杀（张飞/诸葛连弩无限次数，加吕蒙不打杀保持克己）
  const liannuBonus = player.equipment.weapon && player.equipment.weapon.id === 'liannu' ? 999 : 0;
  const canSha = player.hero.id === 'zhangfei' || this.shaUsedCount < player.shaQuota || liannuBonus > 0;
  // 吕蒙AI：如果手牌多且安全，不打杀以保持克己
  const kejiHold = player.hero.id === 'lvmeng' && player.hand.length > player.hp && player.hp > 1;
  if (canSha && !kejiHold) {
    let shaIdx = player.hand.findIndex(c => c.type === 'sha');
    // 关羽AI：如果没有普通杀，找红牌当杀
    if (shaIdx < 0 && player.hero.id === 'guanyu') {
      shaIdx = player.hand.findIndex(c => c.type !== 'sha' && isRedSuit(c.suit));
    }
    if (shaIdx >= 0) {
      const card = player.hand[shaIdx];
      const shaRange = this.getShaRange(player);
      const targets = this.players.filter(p => p.alive && p.id !== player.id && this.calcDistance(player, p, true) <= shaRange && (!this.isDouDizhu || this.getEnemies(player).some(e => e.id === p.id)));
      if (targets.length > 0) {
        const target = targets.reduce((a, b) => a.hp <= b.hp ? a : b);
        this.discardCard(player, card);
        if (player.hero.id !== 'zhangfei' && this.extraShaChances <= 0) this.shaUsedThisTurn = true;
        if (this.extraShaChances > 0) this.extraShaChances--;
        const isWusheng = card.type !== 'sha';
        if (isWusheng) this.addLog(`${player.hero.name}发动【武圣】将${card.suit}【${card.name}】当【杀】使用`, 'skill');
        if (player.hero.id !== 'zhangfei' && this.extraShaChances <= 0) this.shaUsedCount++;
        this.resolveSha(player, target, card);
        this.render();
        setTimeout(() => this.aiPlayCards(player), _aid(800));
        return;
      }
    }
  }

  this.endPlayPhase();
};

// AI/自动 弃牌阶段
Game.prototype.aiGoToDiscardPhase = function(player) {
  const maxKeep = player.hp;
  while (player.hand.length > maxKeep) {
    const c = player.hand.pop();
    this.discardPile.push(c);
  }
  if (player.hand.length < 0) player.hand = [];
  this.addLog(`${player.hero.name}弃牌至${maxKeep}张`);
  this.endTurn();
};

// AI 响应杀
Game.prototype.aiRespondToSha = function(target, source, card) {
  const pd = this.pendingDamageCards[target.id];
  const totalNeeded = pd ? (pd.shanNeeded || 1) : 1;
  // 尝试打出一张闪
  const shanCard = target.hand.find(c => c.type === 'shan');
  const guanyuRed = target.hero.id === 'guanyu' ? target.hand.find(c => isRedSuit(c.suit) && c.type !== 'sha') : null;
  const useShan = shanCard || (guanyuRed && (target.hp <= 2 || Math.random() < 0.7));

  if (useShan) {
    const used = shanCard || guanyuRed;
    const isWusheng = target.hero.id === 'guanyu' && used !== shanCard;
    this.discardCard(target, used);
    if (pd) pd.shanNeeded = (pd.shanNeeded || 1) - 1;
    if (pd && pd.shanNeeded <= 0) {
      delete this.pendingDamageCards[target.id];
      this.addLog(`${target.hero.name}${isWusheng ? '发动【武圣】' : ''}打出【闪】，成功闪避${totalNeeded > 1 ? '（无双）' : ''}`, isWusheng ? 'skill' : '');
    } else if (pd) {
      this.addLog(`${target.hero.name}打出一张【闪】，还需${pd.shanNeeded}张`);
      this.render();
      setTimeout(() => this.aiRespondToSha(target, source, card), _aid(400));
      return;
    } else {
      // pd 已不存在（伤害已被其他路径消解），无需继续响应
      this.addLog(`${target.hero.name}打出【闪】，但伤害已消解，无需继续响应`);
      this.render();
    }
  } else if (target.equipment.armor && target.equipment.armor.id === 'baguazhen') {
    const judgeCard = this.drawOne();
    if (!judgeCard) {
      this.dealDamage(target, source, 1, card);
    } else {
      this.addLog(`${target.hero.name}发动【八卦阵】判定：${judgeCard.suit}【${judgeCard.name}】`, 'skill');
      this.discardPile.push(judgeCard);
      if (isRedSuit(judgeCard.suit)) {
        if (pd) pd.shanNeeded = (pd.shanNeeded || 1) - 1;
        if (pd && pd.shanNeeded <= 0) {
          delete this.pendingDamageCards[target.id];
          this.addLog('判定红色，视为打出【闪】，成功闪避', 'skill');
        } else if (pd) {
          this.addLog(`判定红色，视为打出【闪】，还需${pd.shanNeeded}张`);
          this.render();
          setTimeout(() => this.aiRespondToSha(target, source, card), _aid(400));
          return;
        } else {
          this.addLog('判定为红色，但伤害已消解，无需继续响应');
          this.render();
        }
      } else {
        this.addLog('判定黑色，【八卦阵】未生效', 'skill');
        this.dealDamage(target, source, 1, card);
      }
    }
  } else {
    this.addLog(`${target.hero.name}无法打出【闪】`);
    this.dealDamage(target, source, 1, card);
  }
  this.render();
};

// AI 响应AOE
Game.prototype.aiRespondToAOE = function(target, source, requiredType) {
  let card;
  if (target.hero.id === 'guanyu') {
    card = target.hand.find(c => c.type === requiredType);
    if (!card) card = target.hand.find(c => isRedSuit(c.suit));
  } else {
    card = target.hand.find(c => c.type === requiredType);
  }
  if (card && (target.hp <= 2 || Math.random() < 0.7)) {
    const isWusheng = target.hero.id === 'guanyu' && card.type !== requiredType;
    this.discardCard(target, card);
    this.addLog(`${target.hero.name}${isWusheng ? '发动【武圣】' : ''}打出【${card.name}】`, isWusheng ? 'skill' : '');
  } else {
    this.addLog(`${target.hero.name}受到1点伤害`, 'damage');
    this.dealDamage(target, source, 1);
  }
};

// AI 响应决斗
Game.prototype.aiRespondJuedou = function(defender, challenger, lübuInvolved) {
  const shaCards = [];
  const needed = lübuInvolved && defender.id !== 'lübu' ? 2 : 1;
  for (let i = 0; i < needed; i++) {
    const sha = defender.hand.find(c => c.type === 'sha' && !shaCards.includes(c));
    if (!sha && defender.hero.id === 'guanyu') {
      const red = defender.hand.find(c => isRedSuit(c.suit) && c.type !== 'sha' && !shaCards.includes(c));
      if (red) shaCards.push(red);
    } else if (sha) shaCards.push(sha);
  }
  if (shaCards.length >= needed) {
    const lastCard = shaCards[shaCards.length - 1];
    for (const c of shaCards) {
      const isWusheng = defender.hero.id === 'guanyu' && c.type !== 'sha';
      this.discardCard(defender, c);
      this.addLog(`${defender.hero.name}${isWusheng ? '发动【武圣】' : ''}打出【杀】响应决斗`, isWusheng ? 'skill' : '');
    }
    this.juedouRound(defender, challenger, lastCard);
  } else {
    this.addLog(`${defender.hero.name}无法打出${needed > 1 ? '足够的' : ''}【杀】，受到1点伤害`);
    this.dealDamage(defender, challenger, 1);
    this.render();
    this._resumeSourcePlay(challenger);
  }
};

// AI 濒死处理
Game.prototype.aiHandleDying = function(player) {
  const huatuoJijiu = player.hero.id === 'huatuo' && player.hand.some(c => isRedSuit(c.suit));
  const taoCard = player.hand.find(c => c.type === 'tao');
  const jiuCard = player.hand.find(c => c.type === 'jiu');
  const redCard = huatuoJijiu ? player.hand.find(c => isRedSuit(c.suit)) : null;
  const useCard = taoCard || jiuCard || redCard;
  if (useCard) {
    const isJijiu = huatuoJijiu && useCard !== taoCard && useCard !== jiuCard;
    const isJiu = useCard && useCard.type === 'jiu';
    this.discardCard(player, useCard);
    player.hp = 1;
    const methodName = isJiu ? '【酒】当【桃】' : (isJijiu ? '发动【急救】将红色牌当【桃】' : '使用【桃】');
    this.addLog(`${player.hero.name}${methodName}自救，回复至1点体力`, isJijiu || isJiu ? 'skill' : 'heal');
    return true;
  }
  return false;
};

// AI 放逐
Game.prototype.doFangzhuAI = function(source, target) {
  if (source.hand.length > 1) {
    const card = source.hand[Math.floor(Math.random() * source.hand.length)];
    this.discardCard(source, card);
    this.addLog(`${source.hero.name}选择弃置【${card.name}】（曹丕【放逐】）`, 'skill');
  } else {
    this.drawCard(target, 1);
    this.addLog(`${target.hero.name}发动【放逐】摸了1张牌`, 'skill');
  }
};

// ========== AI 速度快捷键 ==========
// 按下 F 键切换 AI 速度：快 → 正常 → 快 ...
let _aiSpeedToggle = false;
document.addEventListener('keydown', function(e) {
  if (e.key === 'f' || e.key === 'F') {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
    _aiSpeedToggle = !_aiSpeedToggle;
    setAISpeed(_aiSpeedToggle ? 0.08 : 0.45);
    // 更新速度指示器
    const indicator = document.getElementById('ai-speed-indicator');
    if (indicator) {
      indicator.textContent = _aiSpeedToggle ? '⚡快速' : '正常';
      indicator.className = _aiSpeedToggle ? 'ai-speed fast' : 'ai-speed';
    }
  }
});

</script>
<!-- VFX 特效引擎 -->
<script>
// ==================== VFX 特效引擎 ====================
// 独立于 innerHTML 重建的持久化特效层，提供伤害飘字、屏幕震动、
// 技能光效、卡牌飞行、回合过渡等视觉反馈。
// 所有特效挂载在 #vfx-layer 上，不受 game._doRender 的 innerHTML 重建影响。

const VFX = (function() {
  let layer = null;
  let initialized = false;

  function init() {
    if (initialized) return;
    layer = document.getElementById('vfx-layer');
    if (!layer) {
      layer = document.createElement('div');
      layer.id = 'vfx-layer';
      layer.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:500;overflow:hidden;';
      document.body.appendChild(layer);
    }
    initialized = true;
  }

  // 获取玩家英雄面板在屏幕上的位置
  function getPlayerCenter(playerId) {
    const panels = document.querySelectorAll('.hero-panel');
    for (const panel of panels) {
      // 通过面板内的武将名匹配
      const nameEl = panel.querySelector('.hero-name');
      if (!nameEl) continue;
      // 尝试匹配 player id — 游戏中面板没有 data-pid，通过座位匹配
      // 用 avatar class + name 首字 匹配
      const avatar = panel.querySelector('.hero-avatar');
      if (avatar && avatar.textContent.trim()) {
        const rect = panel.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, rect };
      }
    }
    // 降级：屏幕中心
    return { x: window.innerWidth / 2, y: window.innerHeight / 2, rect: null };
  }

  // 按座位号获取面板位置
  function getSeatCenter(seat) {
    const badge = document.querySelector('.seat-badge');
    const panel = badge ? badge.closest('.hero-panel') : null;
    const allPanels = document.querySelectorAll('.player-slot');
    for (const slot of allPanels) {
      const badgeEl = slot.querySelector('.seat-badge');
      if (badgeEl && parseInt(badgeEl.textContent.trim()) === seat + 1) {
        const rect = slot.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, rect };
      }
    }
    return { x: window.innerWidth / 2, y: window.innerHeight / 2, rect: null };
  }

  // 按玩家对象获取位置（优先用 hero.name 匹配面板）
  function getTargetCenter(player) {
    if (!player) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const allSlots = document.querySelectorAll('.player-slot');
    for (const slot of allSlots) {
      const nameEl = slot.querySelector('.hero-name');
      if (nameEl && nameEl.textContent.replace(/[⛓️\s]/g, '').startsWith(player.hero.name)) {
        const panel = slot.querySelector('.hero-panel') || slot;
        const rect = panel.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, rect };
      }
    }
    // 人类底部托盘
    const tray = document.querySelector('.human-tray .hero-panel') || document.querySelector('.human-tray');
    if (tray) {
      const rect = tray.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, rect };
    }
    return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  }

  // ====== 飘字 ======
  function spawnFloatText(x, y, text, type) {
    init();
    const el = document.createElement('div');
    el.className = 'vfx-float-text vfx-' + (type || 'damage');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    layer.appendChild(el);
    // 随机偏移
    const offsetX = (Math.random() - 0.5) * 40;
    el.style.setProperty('--offset-x', offsetX + 'px');
    el.addEventListener('animationend', () => el.remove());
    // 安全清理
    setTimeout(() => { if (el.parentNode) el.remove(); }, 2000);
  }

  // ====== 屏幕震动 ======
  function screenShake(intensity) {
    init();
    const container = document.querySelector('.game-container') || document.body;
    intensity = intensity || 1;
    container.classList.remove('vfx-shake');
    void container.offsetWidth; // reflow
    container.style.setProperty('--shake-intensity', intensity);
    container.classList.add('vfx-shake');
    setTimeout(() => container.classList.remove('vfx-shake'), 400);
  }

  // ====== 目标闪烁 ======
  function flashTarget(player, color) {
    const center = getTargetCenter(player);
    if (!center.rect) return;
    init();
    const el = document.createElement('div');
    el.className = 'vfx-flash-overlay';
    el.style.left = center.rect.left + 'px';
    el.style.top = center.rect.top + 'px';
    el.style.width = center.rect.width + 'px';
    el.style.height = center.rect.height + 'px';
    if (color) el.style.setProperty('--flash-color', color);
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    setTimeout(() => { if (el.parentNode) el.remove(); }, 800);
  }

  // ====== 粒子爆发 ======
  function particleBurst(x, y, color, count) {
    init();
    count = count || 12;
    color = color || '#ff6060';
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'vfx-particle';
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
      const dist = 40 + Math.random() * 60;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');
      p.style.background = color;
      const size = 4 + Math.random() * 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      layer.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
      setTimeout(() => { if (p.parentNode) p.remove(); }, 1000);
    }
  }

  // ====== 技能激活光环 ======
  function skillActivate(player) {
    const center = getTargetCenter(player);
    init();
    // 环形扩散
    const ring = document.createElement('div');
    ring.className = 'vfx-skill-ring';
    ring.style.left = center.x + 'px';
    ring.style.top = center.y + 'px';
    layer.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
    setTimeout(() => { if (ring.parentNode) ring.remove(); }, 1000);
    // 粒子
    particleBurst(center.x, center.y, '#f0d060', 16);
  }

  // ====== 回合过渡横幅 ======
  function turnBanner(heroName, isHuman) {
    init();
    const el = document.createElement('div');
    el.className = 'vfx-turn-banner' + (isHuman ? ' vfx-turn-human' : '');
    el.innerHTML = '<span class="vfx-turn-line"></span>' +
      '<span class="vfx-turn-text">' + heroName + ' 的回合</span>' +
      '<span class="vfx-turn-line"></span>';
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
    setTimeout(() => { if (el.parentNode) el.remove(); }, 2000);
  }

  // ====== 死亡消散 ======
  function deathEffect(player) {
    const center = getTargetCenter(player);
    init();
    // 灰色粒子
    particleBurst(center.x, center.y, '#666666', 20);
    // 暗色扩散环
    const ring = document.createElement('div');
    ring.className = 'vfx-death-ring';
    ring.style.left = center.x + 'px';
    ring.style.top = center.y + 'px';
    layer.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
    setTimeout(() => { if (ring.parentNode) ring.remove(); }, 1200);
  }

  // ====== 卡牌出牌飞行 ======
  function cardFly(fromPlayer, toPlayer) {
    const from = getTargetCenter(fromPlayer);
    const to = getTargetCenter(toPlayer);
    init();
    const card = document.createElement('div');
    card.className = 'vfx-card-fly';
    card.textContent = '🃏';
    card.style.left = from.x + 'px';
    card.style.top = from.y + 'px';
    card.style.setProperty('--target-x', (to.x - from.x) + 'px');
    card.style.setProperty('--target-y', (to.y - from.y) + 'px');
    layer.appendChild(card);
    card.addEventListener('animationend', () => card.remove());
    setTimeout(() => { if (card.parentNode) card.remove(); }, 700);
  }

  // ====== 伤害完整效果 ======
  function damageEffect(player, amount) {
    const center = getTargetCenter(player);
    spawnFloatText(center.x, center.y - 20, '-' + amount, 'damage');
    flashTarget(player, 'rgba(255,50,50,0.5)');
    particleBurst(center.x, center.y, '#ff4040', 10 + amount * 4);
    screenShake(Math.min(amount * 0.5 + 0.5, 1.5));
  }

  // ====== 治疗完整效果 ======
  function healEffect(player, amount) {
    const center = getTargetCenter(player);
    spawnFloatText(center.x, center.y - 20, '+' + amount, 'heal');
    particleBurst(center.x, center.y, '#60ff60', 8);
  }

  // ====== 清理 ======
  function clear() {
    if (layer) layer.innerHTML = '';
  }

  return {
    init,
    spawnFloatText,
    screenShake,
    flashTarget,
    particleBurst,
    skillActivate,
    turnBanner,
    deathEffect,
    cardFly,
    damageEffect,
    healEffect,
    clear,
    getTargetCenter
  };
})();

// 挂到全局
window.VFX = VFX;

</script>
<!-- 斗地主模式（提供 startDouDizhuBidding 等全局函数） -->
<script>
// ==================== 斗地主模式模块 ====================
// 三人斗地主玩法完整实现：1 名地主 vs 2 名农民。包含叫分定地主流程、
// 地主专属增益（+1 体力上限、飞扬/跋扈技能）、农民协作机制（同心补偿）。
// 整体复用标准回合结构与卡牌结算，仅在身份分配/团队目标/地主技能三层做差异注入。
// 设计纪律：
// - 任何会伤害/治疗/给牌的目标选择，都必须经过团队感知过滤（getEnemies / getAllies）
// - 数值全部带 rationale，未经 playtest 的标注 [PLACEHOLDER]

const DDZ_BANNED = ['caopi']; // 禁将：放逐/行殇在该节奏下会造成判定死锁，先拉黑

// 地主专属技能
const SKILL_FEIYANG = {
  id: 'feiyang', name: '飞扬', type: 'skill',
  desc: '判定阶段开始时，若你的判定区有牌，你可以弃置两张手牌，并弃置自己判定区的一张牌。每回合限一次。'
};
const SKILL_BAHU = {
  id: 'bahu', name: '跋扈', type: 'locked',
  desc: '锁定技。准备阶段，你摸一张牌；出牌阶段，你使用【杀】的次数上限+1。'
};
// 农民队友阵亡补偿（展示用标记，非武将原技能）
const SKILL_TONGXIN = {
  id: 'tongxin', name: '同心', type: 'skill',
  desc: '当你的农民队友阵亡时，你可以选择摸两张牌或回复1点体力。'
};

// 地主叫分收益倍率（仅用于结算日志，不影响胜负判定逻辑）
const DDZ_BID_MULTIPLIER = { 0: 1, 1: 1, 2: 2, 3: 3 };

// ==================== 入口：选将后进入叫分 ====================

function startDouDizhuBidding(pickedHeroIds) {
  game = new Game();
  window.game = game;
  game.isDouDizhu = true;
  game.ddzHeroIds = [...pickedHeroIds];

  game.players = pickedHeroIds.map((hId, i) => {
    const hero = HEROES[hId];
    return {
      id: i,
      hero: hero,
      hp: hero.maxHp,
      maxHp: hero.maxHp,
      hand: [],
      equipment: { weapon: null, armor: null, plusHorse: null, minusHorse: null },
      judgeArea: [],
      isHuman: i === 0,
      isAI: i !== 0,
      alive: true,
      linked: false,
      role: null,
      seat: i,
      shaQuota: 1,          // 出杀上限：普通1，地主2（跋扈）
      deckPosition: i,
    };
  });

  game.humanPlayerId = 0;
  game.rolesRevealed = {};
  game.winningTeam = null;
  game.currentPlayerIdx = 0;
  game.phase = 'bidding';
  game.aiThinking = false;
  game.autoPlay = false;
  game.gameOver = false;
  game.feiyangUsedThisTurn = false;
  game.shaUsedCount = 0;
  game.logEntries = [];

  // 叫分顺序：随机起手，顺时针（座位增序）轮转
  const startIdx = Math.floor(Math.random() * 3);
  game.ddzBid = {
    order: [0, 1, 2].map(k => (startIdx + k) % 3),
    current: 0,
    highest: 0,
    highestBidder: -1,
    done: false,
    picks: {},
  };

  game.addLog('====== 三人斗地主 开始 ======', 'important');
  game.addLog('每人已从 3 名武将中选好将，现在叫分决定地主', 'info');
  game.render();
  game._advanceBidding();
}

// ==================== 叫分流程 ====================

Game.prototype._advanceBidding = function () {
  const bid = this.ddzBid;
  if (bid.current >= bid.order.length) { this._resolveBidding(); return; }
  const pid = bid.order[bid.current];
  const player = this.players[pid];
  if (!player.alive) { bid.current++; return this._advanceBidding(); }
  this.currentPlayerIdx = pid;
  this.render();
  if (player.isHuman && !this.autoPlay) {
    // 人类点击叫分按钮（renderBidding 提供）
    return;
  }
  setTimeout(() => this._aiBid(player), 700);
};

Game.prototype._recordBid = function (pid, value) {
  const bid = this.ddzBid;
  bid.picks[pid] = value;
  if (value > bid.highest) { bid.highest = value; bid.highestBidder = pid; }
  this.addLog(`${this.players[pid].hero.name} ${value === 0 ? '不叫' : '叫 ' + value + ' 分'}`, value > 0 ? 'important' : 'normal');
  if (value === 3) {
    bid.current = bid.order.length;
    this._resolveBidding();
    return;
  }
  bid.current++;
  if (bid.current >= bid.order.length) {
    this._resolveBidding();
  } else {
    this.render();
    this._advanceBidding();
  }
};

Game.prototype.humanBid = function (value) {
  const bid = this.ddzBid;
  if (!bid || bid.done) return;
  const pid = bid.order[bid.current];
  if (!this.players[pid] || !this.players[pid].isHuman) return;
  if (value !== 0 && value <= bid.highest) {
    this.addLog('叫分必须高于当前最高分');
    this.render();
    return;
  }
  this._recordBid(pid, value);
};

Game.prototype._aiBid = function (player) {
  if (this.gameOver || !this.ddzBid || this.ddzBid.done) return;
  const bid = this.ddzBid;
  if (bid.order[bid.current] !== player.id) return;
  const want = this._aiBidValue(player);
  const choice = want > bid.highest ? want : 0;
  this._recordBid(player.id, choice);
};

// AI 叫分估值：基于武将强度（体力上限 + 爆发/生存技能加权）
Game.prototype._aiBidValue = function (player) {
  const hero = player.hero;
  let strength = hero.maxHp;
  const ids = hero.skills.map(s => s.id);
  if (ids.includes('paoxiao')) strength += 2;        // 张飞：无限杀
  if (ids.includes('wusheng')) strength += 1;        // 关羽：红牌当杀
  if (hero.id === 'lübu') strength += 2;             // 吕布：无双
  if (ids.includes('kurou')) strength += 1;          // 黄盖：苦肉爆发
  if (ids.includes('jianxiong')) strength += 1;      // 曹操：奸雄吸牌
  if (ids.includes('jiu')) strength += 0;            // 酒不在技能里，忽略
  // 映射到叫分档位
  if (strength >= 7) return 3;
  if (strength >= 5) return 2;
  if (strength >= 4) return 1;
  return 0;
};

Game.prototype._resolveBidding = function () {
  const bid = this.ddzBid;
  bid.done = true;
  let landlordIdx;
  if (bid.highestBidder >= 0) landlordIdx = bid.highestBidder;
  else landlordIdx = bid.order[0]; // 全不叫，首位叫分者当地主
  this._setupDouDizhu(landlordIdx);
};

// ==================== 布置战场 ====================

Game.prototype._setupDouDizhu = function (landlordIdx) {
  this.ddzLandlord = landlordIdx;
  this.players.forEach((p, i) => { p.role = (i === landlordIdx) ? 'dizhu' : 'nongmin'; });

  const landlord = this.players[landlordIdx];
  landlord.maxHp += 1;                 // rationale: 1v2 需要兵力补偿，+1 上限是官方设定
  landlord.hp = landlord.maxHp;
  landlord.shaQuota = 2;               // 跋扈：出杀上限 +1
  landlord.hero = {
    ...landlord.hero,
    skills: [...landlord.hero.skills, SKILL_BAHU, SKILL_FEIYANG],
  };

  // 农民：追加【同心】展示标记
  this.players.filter(p => p.role === 'nongmin').forEach(p => {
    p.hero = { ...p.hero, skills: [...p.hero.skills, SKILL_TONGXIN] };
  });

  this.rolesRevealed = {};
  this.players.forEach(p => { this.rolesRevealed[p.id] = true; }); // 斗地主身份全程公开

  this.deck = [];
  this.discardPile = [];
  this.initDeck();
  this.dealInitialCards();

  this.feiyangUsedThisTurn = false;
  this.shaUsedCount = 0;
  this.currentPlayerIdx = landlordIdx;
  this.phase = 'idle';

  this.addLog(`====== 叫分结束：${landlord.hero.name} 成为地主（体力上限+1，拥有【飞扬】【跋扈】） ======`, 'important');
  const human = this.players[0];
  this.addLog(`你的身份：${human.role === 'dizhu' ? '🏴 地主' : '🌾 农民'} —— ${human.role === 'dizhu' ? '击败两名农民！' : '与队友合力击杀地主！'}`);
  this.startCurrentTurn();
};

// ==================== 团队感知（核心：区分敌我） ====================

Game.prototype.getEnemies = function (player) {
  if (!this.isDouDizhu) return this.players.filter(p => p.alive && p.id !== player.id);
  if (player.role === 'dizhu') return this.players.filter(p => p.alive && p.role === 'nongmin');
  return this.players.filter(p => p.alive && p.role === 'dizhu');
};

Game.prototype.getAllies = function (player) {
  if (!this.isDouDizhu) return [];
  return this.players.filter(p => p.alive && p.id !== player.id && p.role === player.role);
};

// 目标过滤：'enemy' 只留敌人，'ally' 只留队友（含自己），用于技能选目标
Game.prototype.ddzTargetFilter = function (player, intent) {
  if (!this.isDouDizhu) return () => true;
  if (intent === 'enemy') return (p) => this.getEnemies(player).some(e => e.id === p.id);
  if (intent === 'ally') return (p) => p.id === player.id || this.getAllies(player).some(a => a.id === p.id);
  return () => true;
};

Game.prototype.getModeName = function () {
  if (this.isDouDizhu) return '三人斗地主';
  return getGameModeName(this.gameMode);
};

// ==================== 地主【飞扬】 ====================

Game.prototype.maybeFeiyang = function (player) {
  const judgeCards = [...player.judgeArea];
  if (player.isHuman && !this.autoPlay) {
    this.waitingForTarget = { type: 'feiyang', player, judgeCards };
    this.render();
    return;
  }
  // AI：存在负面判定（乐/兵粮/闪电）才发动
  const negative = judgeCards.find(j => ['lebu', 'bingliang', 'shandian'].includes(j.type));
  if (negative) {
    this._doFeiyang(player, negative);
  } else {
    this.feiyangUsedThisTurn = true;
    this.resolveJudgePhase(player);
  }
};

Game.prototype._doFeiyang = function (player, judgeCard) {
  const discard = player.hand.slice(0, 2); // 弃两张手牌（AI/自动取前两张）
  for (const c of discard) this.discardCard(player, c);
  const jidx = player.judgeArea.indexOf(judgeCard);
  if (jidx >= 0) player.judgeArea.splice(jidx, 1);
  this.discardPile.push(judgeCard);
  this.feiyangUsedThisTurn = true;
  this.addLog(`${player.hero.name}发动【飞扬】，弃2张手牌并弃置判定区的【${judgeCard.name}】`, 'skill');
  this.resolveJudgePhase(player);
};

Game.prototype.humanFeiyang = function (judgeIdx) {
  if (!this.waitingForTarget || this.waitingForTarget.type !== 'feiyang') return;
  const { player, judgeCards } = this.waitingForTarget;
  this.waitingForTarget = null;
  if (judgeIdx < 0) {
    this.feiyangUsedThisTurn = true;
    this.resolveJudgePhase(player);
    return;
  }
  this._doFeiyang(player, judgeCards[judgeIdx]);
};

// ==================== 农民【同心】 ====================

Game.prototype.triggerNongminBonus = function (mate, deadMate) {
  if (mate.isHuman && !this.autoPlay) {
    this.waitingForTarget = { type: 'nongmin_bonus', mate, deadMate };
    this.render();
    return;
  }
  if (mate.hp < mate.hero.maxHp) {
    mate.hp++;
    this.addLog(`${mate.hero.name}发动【同心】，回复1点体力`, 'heal');
  } else {
    this.drawCard(mate, 2);
    this.addLog(`${mate.hero.name}发动【同心】，摸2张牌`, 'skill');
  }
  this.render();
  this.checkGameOver();
  // 注意：不在此处 resume——同心塞在 dealDamage → handleDying → killPlayer 链内，
  // 上游的 aiPlayCards / humanRespondShan / processAOETargets 各自会通过递归/回调恢复回合。
  // 若在此 resume，会与上游的递归产生双重 aiPlayCards，导致"连续摸牌"。
};

Game.prototype.humanNongminBonus = function (choice) {
  if (!this.waitingForTarget || this.waitingForTarget.type !== 'nongmin_bonus') return;
  const { mate } = this.waitingForTarget;
  this.waitingForTarget = null;
  if (choice === 'heal') {
    mate.hp++;
    this.addLog(`${mate.hero.name}发动【同心】，回复1点体力`, 'heal');
  } else {
    this.drawCard(mate, 2);
    this.addLog(`${mate.hero.name}发动【同心】，摸2张牌`, 'skill');
  }
  this.render();
  this.checkGameOver();
  // 同心结算后恢复出牌回合：阵亡发生在攻击方（地主）的回合内，
  // currentPlayerIdx 仍是该攻击方，需续上其出牌，否则回合永久挂起。
  if (!this.gameOver) this._resumeGameAfterDying(this.players[this.currentPlayerIdx]);
};

// ==================== 叫分界面渲染 ====================

Game.prototype.renderBidding = function () {
  const app = document.getElementById('app');
  const bid = this.ddzBid;
  const current = bid.order[bid.current];
  const curPlayer = (current != null && this.players[current]) ? this.players[current] : null;
  const isHumanTurn = curPlayer && curPlayer.isHuman && !this.autoPlay && !bid.done;

  const heroCards = this.players.map(p => {
    const active = (p.id === current && !bid.done) ? 'border-color:#f0d060;box-shadow:0 0 25px rgba(240,208,96,0.4);transform:scale(1.05);' : '';
    const bidTxt = bid.picks[p.id] !== undefined ? (bid.picks[p.id] === 0 ? '不叫' : bid.picks[p.id] + '分') : '—';
    return `<div class="hero-card" style="width:160px;padding:18px;background:linear-gradient(180deg,rgba(30,15,5,0.95),rgba(50,25,10,0.95));border:2px solid #8b6914;border-radius:14px;text-align:center;${active}">
      <div class="hero-avatar ${p.hero.avatarClass}" style="margin:0 auto 8px;width:56px;height:56px;font-size:24px;">${p.hero.name[0]}</div>
      <div style="font-size:17px;font-weight:bold;color:#f0d060;">${p.hero.name}</div>
      <div style="font-size:11px;color:#a08050;margin:3px 0;">${p.hero.title}</div>
      <div style="font-size:12px;color:#c0a060;margin-top:6px;">叫分：${bidTxt}</div>
      ${p.isHuman ? '<div style="font-size:11px;color:#60ff80;">（你）</div>' : ''}
    </div>`;
  }).join('');

  let actionHtml = '';
  if (bid.done) {
    actionHtml = `<p style="color:#f0d060;font-size:18px;">叫分结束，正在布置战场…</p>`;
  } else if (isHumanTurn) {
    const minB = bid.highest + 1;
    const opts = [
      { v: 0, label: '不叫', dis: false },
      { v: 1, label: '叫 1 分', dis: 1 < minB },
      { v: 2, label: '叫 2 分', dis: 2 < minB },
      { v: 3, label: '叫 3 分', dis: 3 < minB },
    ];
    actionHtml = `<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      ${opts.map(o => `<button class="btn ${o.v === 0 ? '' : 'skill-btn'}" ${o.dis ? 'disabled' : ''} onclick="game.humanBid(${o.v})">${o.label}</button>`).join('')}
    </div>
    <p style="color:#806040;font-size:12px;margin-top:8px;">当前最高：${bid.highest === 0 ? '暂无' : bid.highest + ' 分'} · 叫分需高于当前最高（或选不叫）</p>`;
  } else {
    actionHtml = `<p style="color:#a08050;font-size:16px;">${curPlayer.hero.name} 正在考虑叫分…</p>`;
  }

  app.innerHTML = `
    <div class="ddz-bidding-wrap" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:20px;">
      <h1 style="font-size:32px;color:#f0d060;text-shadow:0 0 20px rgba(240,208,96,0.5);">🃏 三人斗地主 · 叫分</h1>
      <p style="color:#c0a060;font-size:14px;">1 名地主对抗 2 名农民，叫分最高者成为地主（全不叫则首位叫分者当地主）</p>
      <div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;">${heroCards}</div>
      <div style="background:rgba(0,0,0,0.3);padding:18px 30px;border-radius:14px;text-align:center;min-width:300px;">${actionHtml}</div>
      <button class="btn-outline" onclick="showHeroSelect()" style="margin-top:6px;">⬅ 返回主菜单</button>
    </div>`;
};

}

// ========== 主机：开始等待 ==========
function pvpStartHost() {
  const game = new Game();
  pvpManager = new PvPManager(game);
  game.pvpManager = pvpManager;
  
  pvpShowWaiting('正在创建房间...');
  
  pvpManager.onStatus((msg) => pvpUpdateStatus(msg));
  
  pvpManager.onConnected(() => {
    pvpUpdateStatus('玩家已加入！准备开始游戏...', false);
    // 显示模式选择

  });

  });

  pvpManager.createRoom();

    const panel = document.getElementById('pvp-panel');

function pvpCopyRoomCode() {
  if (pvpManager && pvpManager.roomCode) {
    navigator.clipboard.writeText(pvpManager.roomCode).then(() => {
      pvpUpdateStatus('已复制房间码！', false);
    }).catch(() => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = pvpManager.roomCode;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      pvpUpdateStatus('已复制房间码！', false);
    });
  }
}

// ========== 客机：加入房间 ==========
function pvpStartJoin() {
  const input = document.getElementById('pvp-room-input');
  if (!input) return;
  const code = input.value.trim().toUpperCase();
  if (code.length !== 6) {
    pvpUpdateStatus('请输入6位房间码', true);
    return;
  }
  
  const game = new Game();
  pvpManager = new PvPManager(game);
  game.pvpManager = pvpManager;
  
  pvpShowWaiting('正在加入房间...');
  
  pvpManager.onStatus((msg) => pvpUpdateStatus(msg));
  
  pvpManager.onConnected(() => {
    pvpUpdateStatus('已成功加入房间！等待主机开始游戏...', false);
  });
  
  pvpManager.onDisconnected(() => {
    pvpUpdateStatus('连接已断开', true);
  });
  
  // 主机发来的 game_init 会包含初始状态
  pvpManager.onAction((action, payload) => {
    if (action === 'mode_select') {
      pvpUpdateStatus('主机正在选择游戏模式...', false);
    } else if (action === 'host_hero_picked') {
      pvpUpdateStatus('主机已选将，轮到你了...', false);
      // 主机选完后，客机选将
      setTimeout(() => startPvPGuestHeroPick(payload.availableHeroes, payload.hostHeroId), 500);
    } else if (action === 'game_init') {
      // 接收完整游戏状态，开始游戏
      pvpUpdateStatus('游戏开始！', false);
      startPvPGuestGame(game, payload);
    }
  });
  
  setupPvpActionHandler(game);
  
  pvpManager.joinRoom(code);
}

// ========== 主机：初始化 PvP 游戏 ==========
function pvpInitHostGame(game) {
  const gameMode = game._pvpGameMode;
  const totalPlayers = game._pvpTotalPlayers;
  const hostHero = game._pvpHostHero;
  const guestHero = game._pvpGuestHero;
  const pool = game._pvpHeroPool;
  
  // 初始化游戏 (PvP 模式，玩家0=主机，玩家1=客机)
  game.initPvP(gameMode, totalPlayers, pool, hostHero, guestHero);
  
  // 序列化初始状态并发送给客机
  const initialState = serializeGameState(game);
  // 为客机提供自己的手牌 (玩家1)
  initialState.players.forEach(p => {
    if (p.id === 1 && p.isHuman) {
      const guestPlayer = game.players[1];
      if (guestPlayer) {
        p.hand = guestPlayer.hand.map(c => ({ id: c.id, name: c.name, suit: c.suit, number: c.number, type: c.type, category: c.category }));
      }
    }
  });
  // 隐藏主机手牌内容，确保客机手牌存在
  initialState.players.forEach(p => {
    if (p.id === 0) p.hand = null;
    if (p.id === 1 && (!p.hand || p.hand.length === 0)) {
      const gp = game.players[1];
      if (gp) p.hand = gp.hand.map(c => ({ id: c.id, name: c.name, suit: c.suit, number: c.number, type: c.type, category: c.category }));
    }
  });
  initialState._pvpMode = true;
  
  pvpManager.sendGameInit(initialState);
  
  // 渲染主机视角
  game.render();
  
  // 如果当前是客机回合，进入等待状态
  const currentPlayer = game.players[game.currentPlayerIdx];
  if (currentPlayer && currentPlayer.isHuman && currentPlayer.id !== 0) {
    game._pvpWaitingForRemote = true;
  }
  
  // 开始回合
  game.startCurrentTurn();
}

// ========== 客机：开始游戏（接收主机状态） ==========
function startPvPGuestGame(game, initialState) {
  game.importPvPState(initialState);
  game.render();
  
  // 如果当前是客机回合
  const currentPlayer = game.players[game.currentPlayerIdx];
  if (currentPlayer && currentPlayer.isHuman && currentPlayer.id === 1) {
    game._pvpWaitingForRemote = false;
  } else {
    game._pvpWaitingForRemote = true;
  }
  
  game.startCurrentTurn();
}

// ========== PvP 动作处理器 ==========
function setupPvpActionHandler(game) {
  game._isPvP = true;
  
  pvpManager.onAction((action, payload) => {
    if (action === 'game_init' || action === 'host_hero_picked' || 
        action === 'mode_select' || action === 'guest_hero_picked') return;
    
    handlePvpRemoteAction(game, action, payload);
  });
  
  // PvP 断开处理
  pvpManager.onDisconnected(() => {
    if (!game.gameOver) {
      game.addLog('⚠️ 对手已断开连接，游戏暂停', 'important');
      game.render();
    }
  });
}

function handlePvpRemoteAction(game, action, payload) {
  const { playerId } = payload || {};
  
  switch (action) {
    case 'playCard':
      // 远程玩家打出卡牌
      game._pvpRemotePlayCard(payload);
      break;
    
    case 'respond':
      // 远程玩家响应
      game._pvpRemoteRespond(payload);
      break;
    
    case 'endPhase':
      game._pvpRemoteEndPhase(payload);
      break;
    
    case 'playShan':
      game._pvpRemotePlayShan(payload);
      break;
    
    case 'useSkill':
      game._pvpRemoteUseSkill(payload);
      break;
    
    case 'selectHeroPick':
      game._pvpRemoteHeroPick(payload);
      break;
    
    case 'guoheDiscard':
      game._pvpRemoteGuoheDiscard(payload);
      break;
    
    case 'shunshouSteal':
      game._pvpRemoteShunshouSteal(payload);
      break;
    
    case 'tiesuoSelect':
      game._pvpRemoteTiesuoSelect(payload);
      break;
    
    case 'tiesuoReforge':
      game._pvpRemoteTiesuoReforge(payload);
      break;
    
    case 'huogongShow':
      game._pvpRemoteHuogongShow(payload);
      break;
    
    case 'huogongDiscard':
      game._pvpRemoteHuogongDiscard(payload);
      break;
    
    case 'fangzhuChoice':
      game._pvpRemoteFangzhuChoice(payload);
      break;
    
    case 'jianxiongChoice':
      game._pvpRemoteJianxiongChoice(payload);
      break;
    
    case 'tianduChoice':
      game._pvpRemoteTianduChoice(payload);
      break;
    
    case 'leijiChoice':
      game._pvpRemoteLeijiChoice(payload);
      break;
    
    case 'discardCards':
      game._pvpRemoteDiscardCards(payload);
      break;
    
    case 'aiAction':
      game._pvpRemoteAiAction(payload);
      break;
    
    case 'stateSync':
      // 完整状态同步（客机接收）
      if (pvpManager && !pvpManager.isHost) {
        applyGameState(game, payload);
        game.render();
        // 检查是否需要恢复回合推进
        const cp = game.players[game.currentPlayerIdx];
        if (cp && cp.isHuman && cp.id === 1) {
          // 是客机回合，恢复游戏
          game._pvpWaitingForRemote = false;
          // 根据阶段恢复
          if (game.phase === 'draw') {
            setTimeout(() => game.humanDrawPhase(false), 300);
          } else if (game.phase === 'play') {
            game.render();
          } else if (game.phase === 'discard') {
            setTimeout(() => game.handleHumanDiscard(), 300);
          }
        }
      }
      break;
    
    default:
      console.log('[PvP] 未处理的远程动作:', action, payload);
  }
}

// ========== 广播动作（当前玩家调用） ==========
function pvpBroadcast(game, action, payload) {
  if (!game._isPvP || !pvpManager || !pvpManager.connected) return;
  
  // 只在本地玩家行动时广播到对方
  const currentPlayer = game.players[game.currentPlayerIdx];
  if (!currentPlayer) return;
  
  // 确定谁是我的本地玩家
  const myPlayerIdx = pvpManager.isHost ? 0 : 1;
  const remotePlayerIdx = pvpManager.isHost ? 1 : 0;
  
  const myPlayer = game.players.find(p => p.id === myPlayerIdx);
  if (!myPlayer || !myPlayer.isHuman) return;
  
  // 如果是我的回合，广播动作
  if (myPlayerIdx === currentPlayer.id) {
    pvpManager.sendAction(action, { ...payload, playerId: myPlayerIdx });
  }
  // 如果是对响应或主动技能，也广播
  else if (action === 'respond' || action === 'useSkill' || action === 'playShan' || 
           action === 'guoheDiscard' || action === 'shunshouSteal' ||
           action === 'huogongShow' || action === 'huogongDiscard' ||
           action === 'fangzhuChoice' || action === 'jianxiongChoice' ||
           action === 'tianduChoice' || action === 'leijiChoice' ||
           action === 'discardCards') {
    pvpManager.sendAction(action, { ...payload, playerId: myPlayerIdx });
  }
}

// 广播 AI 动作（仅主机）
function pvpBroadcastAiAction(game, action, payload) {
  if (!game._isPvP || !pvpManager || !pvpManager.connected) return;
  if (!pvpManager.isHost) return;
  pvpManager.sendAction('aiAction', { action, payload });
}

// ========== 洗牌辅助函数 ==========
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ==================== 选将系统 ====================

let heroPickState = null;

function startHeroPick(gameMode) {
  const totalPlayers = gameMode === 'pve' ? 2 : (gameMode === 1 || gameMode === 'ddz') ? 3 : gameMode;
  const allHeroIds = Object.keys(HEROES);

  // 斗地主禁将：剔除与节奏冲突的武将
  const availableHeroes = allHeroIds.filter(h => !(gameMode === 'ddz' && DDZ_BANNED.includes(h)));

  // 为每个玩家随机分配3个候选英雄（不重复）
  const pool = [...availableHeroes];
  for (let k = pool.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [pool[k], pool[j]] = [pool[j], pool[k]];
  }
  const choices = [];
  for (let i = 0; i < totalPlayers; i++) {
    for (let k = pool.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [pool[k], pool[j]] = [pool[j], pool[k]];
    }
    choices.push(pool.slice(0, 3));
  }

  // 5人或8人模式：预分配身份，确定主公
  let roles = null;
  let lordIdx = -1;
  let lordHero = null;
  if (gameMode >= 5) {
    const rolePool = buildRolePool(gameMode);
    // 洗牌身份
    for (let i = rolePool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rolePool[i], rolePool[j]] = [rolePool[j], rolePool[i]];
    }
    roles = rolePool;
    lordIdx = rolePool.indexOf('zhugong');

    // 主公多一个候选武将名额（4选1）
    if (lordIdx >= 0) {
      const heroPool = [...allHeroIds];
      for (let k = heroPool.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [heroPool[k], heroPool[j]] = [heroPool[j], heroPool[k]];
      }
      const extraHero = heroPool.find(h => !choices[lordIdx].includes(h));
      if (extraHero) choices[lordIdx].push(extraHero);
    }

    // 主公是AI：自动选将（优先选体力最高的）
    if (lordIdx > 0) {
      const lordChoices = [...choices[lordIdx]];
      lordChoices.sort((a, b) => HEROES[b].maxHp - HEROES[a].maxHp);
      lordHero = lordChoices[0];
    }
  }

  const picked = new Array(totalPlayers).fill(null);
  if (lordHero) picked[lordIdx] = lordHero;

  // 若主公AI已先选将，从人类候选池中排除该武将，避免重复
  let humanChoices = [...choices[0]];
  if (lordHero) {
    humanChoices = humanChoices.filter(h => h !== lordHero);
    while (humanChoices.length < 3) {
      const extra = allHeroIds.find(h => !humanChoices.includes(h) && !picked.includes(h));
      if (extra) humanChoices.push(extra);
      else break;
    }
  }

  heroPickState = { gameMode, choices, picked, totalPlayers, roles, lordIdx, lordHero };
  showHumanHeroPick(humanChoices, gameMode, lordHero, lordIdx);
}

      transition:all 0.3s;
    " onmouseover="this.style.transform='scale(1.08)';this.style.borderColor='#f0d060';this.style.boxShadow='0 0 30px rgba(240,208,96,0.4)'"

      <div style="font-size:18px;color:#f0d060;font-weight:bold;">👑 你是主公（一号位）</div>

  } else if (lordHero && lordIdx > 0) {

    const lh = HEROES[lordHero];
    lordInfoHtml = `<div style="background:rgba(240,208,96,0.12);border:2px solid #f0d060;border-radius:14px;padding:16px 28px;text-align:center;margin-bottom:8px;">
      <div style="font-size:16px;color:#f0d060;font-weight:bold;">👑 主公已选择（一号位）</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;">
        <div class="hero-avatar ${lh.avatarClass}" style="width:52px;height:52px;font-size:24px;margin:0;">${lh.name[0]}</div>
        <div style="text-align:left;">
          <div style="font-size:19px;font-weight:bold;color:#f0d060;">${lh.name}</div>
          <div style="font-size:12px;color:#c0a060;">${lh.title} · 体力上限+1: ${'❤️'.repeat(lh.maxHp + 1)}</div>
        </div>
      </div>
    </div>`;
  }

  const pickCount = heroChoices.length;
  const modeNames = { 1: '1v1 混战模式', 5: '五人身份局', 8: '八人身份局' };
  app.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:25px;padding:20px;">
      <h1 style="font-size:30px;color:#f0d060;text-shadow:0 0 20px rgba(240,208,96,0.5);">🎯 选择武将</h1>
      <p style="color:#c0a060;font-size:15px;">${getGameModeName(gameMode) || gameMode + '人局'} — 从${pickCount}名武将中选择一位</p>
      ${lordInfoHtml}
      <div class="hero-pick-grid" style="display:flex;gap:25px;flex-wrap:wrap;justify-content:center;">
        ${cardsHtml}
      </div>
      <p style="color:#806040;font-size:12px;">点击武将卡片确认选择</p>
    </div>
  `;
}

function confirmHeroPick(heroId) {
  if (!heroPickState) return;
  heroPickState.picked[0] = heroId;

  // AI自动选将：跳过已选的主公槽位
  const pickedHeroIds = [...heroPickState.picked]; // 包含主公已选
  for (let i = 1; i < heroPickState.totalPlayers; i++) {
    if (pickedHeroIds[i]) continue; // 主公(非人类)已自动选
    const choices = heroPickState.choices[i].filter(h => !pickedHeroIds.includes(h));
    if (choices.length > 0) {
      choices.sort((a, b) => HEROES[b].maxHp - HEROES[a].maxHp);
      pickedHeroIds[i] = choices[0];
    } else {
      const remaining = Object.keys(HEROES).filter(h => !pickedHeroIds.includes(h));
      pickedHeroIds[i] = remaining[Math.floor(Math.random() * remaining.length)];
    }
  }

  const preRoles = heroPickState.roles;
  const isDdz = heroPickState.gameMode === 'ddz';
  heroPickState = null;
  if (isDdz) {
    document.getElementById('app').innerHTML = '';
    startDouDizhuBidding(pickedHeroIds);
    return;
  }
  const mode = pickedHeroIds.length >= 5 ? pickedHeroIds.length : 1;
  document.getElementById('app').innerHTML = '';
  game = new Game();
  window.game = game;
  game.init(mode, pickedHeroIds, preRoles);
  game.render();
}

function showReplay() {
  const data = window._replayData;
  if (!data || !data.logs || data.logs.length === 0) return;

  // 停止之前的自动播放
  if (window._replayTimer) { clearInterval(window._replayTimer); window._replayTimer = null; }
  window._replayStep = data.logs.length - 1; // 默认到最后一步
  window._replayAuto = false;

  const app = document.getElementById('app');
  const renderReplayUI = () => {
    const step = window._replayStep;
    const maxStep = data.logs.length - 1;

    let playersHtml = '';
    for (const p of data.playerInfo) {
      const roleData = ROLES[p.role] || ROLES.free || { name: '自由', icon: '🆓', color: '#aaa' };
      const status = p.alive ? '<span style="color:#4caf50;">存活</span>' : '<span style="color:#f44336;">阵亡</span>';
      playersHtml += `<div class="replay-player-card ${!p.alive ? 'dead' : ''}">
        <div class="replay-player-name" style="color:${roleData.color};">${p.name}</div>
        <div class="replay-player-info">${roleData.icon} ${roleData.name} · ${status}</div>
        <div class="replay-player-info">${p.faction} · 体力${p.maxHp}</div>
        ${p.isHuman ? '<div class="replay-player-you">你</div>' : ''}
      </div>`;
    }

    let logHtml = '';
    for (let i = 0; i <= step; i++) {
      const entry = data.logs[i];
      if (!entry) continue;
      if (entry.msg.startsWith('====================================')) {
        logHtml += `<div class="replay-log-entry replay-log-entry-separator ${i === step ? 'current' : ''}">——————</div>`;
      } else {
        const typeClass = entry.type || '';
        logHtml += `<div class="replay-log-entry ${typeClass} ${i === step ? 'current' : ''}" data-step="${i}">${entry.msg}</div>`;
      }
    }

    if (step < maxStep) {
      logHtml += `<div class="replay-log-entry replay-log-entry-pending">··· 后续步骤 ···</div>`;
    }

    const progress = maxStep > 0 ? Math.round((step / maxStep) * 100) : 100;

    app.innerHTML = `<div class="replay-overlay">
      <div class="replay-container">
        <div class="replay-header">
          <h2>📋 对局复盘</h2>
          <div class="replay-summary">
            <span>${data.modeName}</span>
            <span class="replay-dot">·</span>
            <span>共 ${data.turnCount} 回合</span>
            <span class="replay-dot">·</span>
            <span style="color:#f0d060;">${data.resultMsg}</span>
          </div>
        </div>
        <div class="replay-body">
          <div class="replay-sidebar">
            <h3>参战玩家</h3>
            ${playersHtml}
          </div>
          <div class="replay-main">
            <div class="replay-log-header">
              <span>📜 战斗日志</span>
              <span class="replay-step-indicator">${step + 1} / ${data.logs.length}</span>
            </div>
            <div class="replay-log-list" id="replayLogList">
              ${logHtml}
            </div>
          </div>
        </div>
        <div class="replay-footer">
          <div class="replay-controls">
            <button class="replay-btn" onclick="replayStepTo(0)" ${step <= 0 ? 'disabled' : ''}>⏮ 开头</button>
            <button class="replay-btn" onclick="replayStepPrev()" ${step <= 0 ? 'disabled' : ''}>◀ 上一步</button>
            <button class="replay-btn replay-btn-play" onclick="replayToggleAuto()">${window._replayAuto ? '⏸ 暂停' : '▶ 自动播放'}</button>
            <button class="replay-btn" onclick="replayStepNext()" ${step >= maxStep ? 'disabled' : ''}>下一步 ▶</button>
            <button class="replay-btn" onclick="replayStepTo(${maxStep})" ${step >= maxStep ? 'disabled' : ''}>结尾 ⏭</button>
          </div>
          <div class="replay-speed" style="${window._replayAuto ? '' : 'opacity:0.4;'}">
            速度：<input type="range" min="1" max="10" value="${window._replaySpeed || 4}" oninput="replaySetSpeed(this.value)">
            <span>${window._replaySpeed || 4}/10</span>
          </div>
          <button class="replay-btn replay-btn-close" onclick="replayClose()">✕ 关闭复盘</button>
        </div>
      </div>
    </div>`;

    // 滚动到当前步骤
    setTimeout(() => {
      const logList = document.getElementById('replayLogList');
      if (logList) {
        const curEntry = logList.querySelector('.replay-log-entry.current');
        if (curEntry) curEntry.scrollIntoView({ behavior: 'smooth', block: 'center' });
        else logList.scrollTop = logList.scrollHeight;
      }
    }, 50);
  };

  renderReplayUI();
}

// 复盘控制函数
function replayStepTo(n) {
  const data = window._replayData;
  if (!data) return;
  window._replayStep = Math.max(0, Math.min(n, data.logs.length - 1));
  showReplay();
}

function replayStepNext() {
  const data = window._replayData;
  if (!data) return;
  if (window._replayStep < data.logs.length - 1) {
    window._replayStep++;
    showReplay();
  }
}

function replayStepPrev() {
  if (window._replayStep > 0) {
    window._replayStep--;
    showReplay();
  }
}

function replayToggleAuto() {
  window._replayAuto = !window._replayAuto;
  if (window._replayAuto) {
    window._replaySpeed = window._replaySpeed || 4;
    replayAutoAdvance();
  } else {
    if (window._replayTimer) { clearInterval(window._replayTimer); window._replayTimer = null; }
    showReplay();
  }
}

function replayAutoAdvance() {
  if (window._replayTimer) clearInterval(window._replayTimer);
  const data = window._replayData;
  if (!data) { window._replayAuto = false; return; }
  window._replayTimer = setInterval(() => {
    if (!window._replayAuto || window._replayStep >= data.logs.length - 1) {
      clearInterval(window._replayTimer);
      window._replayTimer = null;
      window._replayAuto = false;
      showReplay();
      return;
    }
    window._replayStep++;
    showReplay();
  }, 1100 - (window._replaySpeed || 4) * 100);
}

function replaySetSpeed(v) {
  window._replaySpeed = parseInt(v);
  if (window._replayAuto) {
    replayAutoAdvance();
  }
  showReplay();
}

function replayClose() {
  if (window._replayTimer) { clearInterval(window._replayTimer); window._replayTimer = null; }
  window._replayAuto = false;
  // 重新渲染游戏结束画面
  if (window.game && window.game.gameOver) {
    window.game.render();
  }
}

showHeroSelect();
